<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to AllEMSDrugs</title>
</head>
<body style="margin:0;padding:0;background-color:#0d0d0b;font-family:'IBM Plex Sans',system-ui,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0d0b;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background-color:#1e1e1c;border-radius:12px;padding:40px 36px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#999895;">AllEMSDrugs</p>
              <h1 style="margin:0 0 20px;font-size:22px;font-weight:600;color:#ede9e0;line-height:1.3;">Sign in to AllEMSDrugs</h1>
              <p style="margin:0 0 32px;font-size:14px;line-height:1.6;color:#999895;">Click the button below to sign in. This link expires in 1 hour and can only be used once.</p>
              <a href="{{ .ConfirmationURL }}"
style="display:inline-block;background-color:#5e9be8;color:#0d0d0b;font-size:15px;font-weight:600;text-decoration:none;padding:13px 32px;border-radius:999px;">Sign In</a>
              <p style="margin:36px 0 0;font-size:12px;color:#555450;">If you didn't request this, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
